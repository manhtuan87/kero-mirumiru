<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>icon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap">
<style>html, body { margin: 0; background: transparent; overflow: hidden; } canvas { display: block; }</style></head>
<body><canvas id="c"></canvas>
<script src="../js/draw.js"></script><script src="../js/data.js"></script><script src="../js/art.js"></script>
<script>
// The app icon, drawn with the game's own pictures: ケロはかせ looking up at an eye chart "C" and a star.
// ?size=512  ?mask=1 (maskable: full square, picture kept inside the safe zone)
// Saved as PNG with headless Chrome (see tools/make-icons.ps1).
var q = new URLSearchParams(location.search), size = +q.get('size') || 512, mask = q.get('mask') === '1';
var c = document.getElementById('c'), g = c.getContext('2d');
c.width = c.height = size;
function draw() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, size, size);
  var s = size / 100;
  g.scale(s, s);
  var bgGrad = g.createLinearGradient(0, 0, 0, 100);
  bgGrad.addColorStop(0, '#9fe8d3'); bgGrad.addColorStop(1, '#effffa');
  if (mask) { g.fillStyle = bgGrad; g.fillRect(0, 0, 100, 100); }
  else { Draw.roundRect(g, 0, 0, 100, 100, 22); g.fillStyle = bgGrad; g.fill(); }
  g.save();
  if (mask) { g.translate(50, 50); g.scale(0.8, 0.8); g.translate(-50, -50); }
  // the eye chart C and a little star, up where ケロはかせ is looking
  Art.ringC(g, 22, 22, 11, 1);
  Draw.sparkle(g, 80, 20, 7, '#ffd23d');
  Art.ringC(g, 86, 46, 6, 3);
  // ケロはかせ
  g.save(); g.translate(51, 63); g.scale(0.5, 0.5); g.translate(-180, -300);
  Draw.critter(g, { x: 180, y: 300, t: 0, kind: 'frog', look: { x: 60, y: 160 }, open: 0, mode: 'idle', mt: 0, wear: Art.hakase });
  g.restore();
  Draw.sparkle(g, 12, 58, 3.5, '#ffffff');
  Draw.sparkle(g, 60, 8, 3, '#ffffff');
  g.restore();
}
document.fonts.ready.then(function () { draw(); document.title = 'ready'; });
draw();
</script></body></html>
